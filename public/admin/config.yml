backend:
  name: github
  repo: v-s-p/jaguar-ltd-website
  branch: main
  base_url: https://jaguar.ataerk.com
  auth_endpoint: api/auth

locale: bg
media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: "yilmaz"
    label: "Yılmaz Машини"
    files:
      - file: "src/data/yilmaz.json"
        label: "Yılmaz Makine Listesi"
        name: "yilmaz_machines"
        fields:
          - name: machines
            label: Makineler
            widget: list
            fields:
              - { name: slug, label: Slug, widget: string }
              - { name: brand, label: Marka, widget: hidden, default: yilmaz }
              - name: diller
                label: Diller
                widget: object
                fields:
                  - name: en
                    label: English
                    widget: object
                    fields:
                      - { name: name, label: Name, widget: string }
                      - { name: description, label: Description, widget: text }
                      - { name: pdf_catalog, label: PDF Catalog, widget: string, required: false }

  - name: "gocmaksan"
    label: "Gocmaksan Машини"
    files:
      - file: "src/data/gocmaksan.json"
        label: "Gocmaksan Makine Listesi"
        name: "gocmaksan_machines"
        fields:
          - name: machines
            label: Makineler
            widget: list
            fields:
              - { name: slug, label: Slug, widget: string }
              - { name: brand, label: Marka, widget: hidden, default: gocmaksan }
              - name: diller
                label: Diller
                widget: object
                fields:
                  - name: en
                    label: English
                    widget: object
                    fields:
                      - { name: name, label: Name, widget: string }
                      - { name: description, label: Description, widget: text }
                      - { name: pdf_catalog, label: PDF Catalog, widget: string, required: false }

  - name: "settings"
    label: "Настройки / Ayarlar"
    delete: false
    create: false
    files:
      - file: "src/data/siteMetadata.ts"
        label: "Site Ayarları"
        name: "site_settings"
        fields:
          - { name: contact_email, label: Email, widget: string }
          - { name: contact_phone, label: Telefon, widget: string }

  - name: "pages"
    label: "Страници / Sayfalar"
    delete: false
    create: false
    files:
      - file: "src/data/pages/about.json"
        label: "Hakkımızda / За нас"
        name: "about"
        fields:
          - { name: title_bg, label: "Başlık (BG)", widget: string }
          - { name: title_en, label: "Başlık (EN)", widget: string }
          - { name: title_ru, label: "Başlık (RU)", widget: string }
          - { name: body_bg, label: "İçerik (BG)", widget: markdown }
          - { name: body_en, label: "İçerik (EN)", widget: markdown }
          - { name: body_ru, label: "İçerik (RU)", widget: markdown }
      - file: "src/data/pages/contact.json"
        label: "İletişim / Контакти"
        name: "contact"
        fields:
          - { name: phone, label: Telefon, widget: string }
          - { name: email, label: Email, widget: string }
          - { name: address_bg, label: "Adres (BG)", widget: string }
          - { name: address_en, label: "Adres (EN)", widget: string }
          - { name: address_ru, label: "Adres (RU)", widget: string }
