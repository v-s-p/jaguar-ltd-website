backend:
  name: github
  repo: v-s-p/jaguar-ltd-website
  branch: main
  base_url: https://jaguar.ataerk.com
  auth_endpoint: api/auth

locale: bg
media_folder: public/images
public_folder: /images

collections:
  - name: "yilmaz"
    label: "Yılmaz Машини"
    folder: "src/data/machines/yilmaz"
    media_folder: "public/images/yilmaz"
    public_folder: "/images/yilmaz"
    create: true
    delete: false
    identifier_field: slug
    extension: json
    format: json
    fields:
      - { name: slug, label: Slug, widget: string }
      - { name: brand, label: Brand, widget: hidden, default: yilmaz }
      - name: categories
        label: Kategoriler
        widget: list
        field: { name: cat, label: Kategori, widget: string }
      - { name: subcategory, label: Alt Kategori, widget: string }
      - name: diller
        label: Diller
        widget: object
        fields:
          - name: en
            label: English
            widget: object
            fields:
              - { name: name, label: Name, widget: string }
              - { name: description, label: Description, widget: text }
              - { name: pdf_catalog, label: PDF Catalog, widget: string, required: false }
              - name: images
                label: Görseller
                widget: list
                field:
                  name: image
                  label: Görsel URL
                  widget: image
          - name: bg
            label: "Български"
            widget: object
            fields:
              - { name: name, label: "Наименование", widget: string }
              - { name: description, label: "Описание", widget: text }
          - name: ru
            label: "Русский"
            widget: object
            fields:
              - { name: name, label: "Название", widget: string }
              - { name: description, label: "Описание", widget: text }

  - name: "gocmaksan"
    label: "Gocmaksan Машини"
    folder: "src/data/machines/gocmaksan"
    media_folder: "public/images/gocmaksan"
    public_folder: "/images/gocmaksan"
    create: true
    delete: false
    identifier_field: slug
    extension: json
    format: json
    fields:
      - { name: slug, label: Slug, widget: string }
      - { name: brand, label: Brand, widget: hidden, default: gocmaksan }
      - name: categories
        label: Kategoriler
        widget: list
        field: { name: cat, label: Kategori, widget: string }
      - { name: subcategory, label: Alt Kategori, widget: string }
      - name: diller
        label: Diller
        widget: object
        fields:
          - name: en
            label: English
            widget: object
            fields:
              - { name: name, label: Name, widget: string }
              - { name: description, label: Description, widget: text }
              - { name: pdf_catalog, label: PDF Catalog, widget: string, required: false }
              - name: images
                label: Görseller
                widget: list
                field:
                  name: image
                  label: Görsel URL
                  widget: image
          - name: bg
            label: "Български"
            widget: object
            fields:
              - { name: name, label: "Наименование", widget: string }
              - { name: description, label: "Описание", widget: text }
          - name: ru
            label: "Русский"
            widget: object
            fields:
              - { name: name, label: "Название", widget: string }
              - { name: description, label: "Описание", widget: text }

  - name: "settings"
    label: "Настройки / Ayarlar"
    delete: false
    create: false
    files:
      - file: "src/data/settings.json"
        label: "Site Ayarları"
        name: "site_settings"
        fields:
          - { name: email, label: "E-posta", widget: string }
          - { name: phone, label: "Telefon", widget: string }
          - { name: address, label: "Adres", widget: string }
          - { name: warehouse, label: "Depo / Ambar", widget: string }

  - name: "pages"
    label: "Страници / Sayfalar"
    delete: false
    create: false
    files:
      - file: "src/data/pages/about.json"
        label: "Hakkımızda / За нас"
        name: "about"
        fields:
          - { name: title_bg, label: "Başlık (BG)", widget: string }
          - { name: title_en, label: "Başlık (EN)", widget: string }
          - { name: title_ru, label: "Başlık (RU)", widget: string }
          - { name: body_bg, label: "İçerik (BG)", widget: markdown }
          - { name: body_en, label: "İçerik (EN)", widget: markdown }
          - { name: body_ru, label: "İçerik (RU)", widget: markdown }
      - file: "src/data/pages/contact.json"
        label: "İletişim / Контакти"
        name: "contact"
        fields:
          - { name: phone, label: Telefon, widget: string }
          - { name: email, label: Email, widget: string }
          - { name: address_bg, label: "Adres (BG)", widget: string }
          - { name: address_en, label: "Adres (EN)", widget: string }
          - { name: address_ru, label: "Adres (RU)", widget: string }
