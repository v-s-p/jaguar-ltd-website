name: "1️⃣ Scrape Discovery (monthly)"

on:
  schedule:
    - cron: '0 5 1 * *'   # Her ayın 1'i, 05:00 UTC
  workflow_dispatch:        # Manuel tetikleme

jobs:
  discover:
    name: Scrape & Discover New Machines
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run discovery scrape
        id: scrape
        run: python scripts/scrape_discovery.py

      - name: Commit staging file
        run: |
          git config user.name  "scrape-bot[bot]"
          git config user.email "scrape-bot@jaguar-ltd.com"
          git add src/data/_staging/
          git diff --staged --quiet || git commit -m "chore(scrape): discovery $(date -u +%Y-%m)"
          git push

      - name: Send email to admins
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[Jaguar LTD CI] 🔍 YILMAZ Scrape — ${{ steps.scrape.outputs.new_count }} yeni makine bulundu"
          to: ${{ secrets.ADMIN_EMAILS }}
          from: "Jaguar CI <${{ secrets.MAIL_USERNAME }}>"
          body: |
            ${{ steps.scrape.outputs.email_body }}
